name: Update Package Managers

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Get release info
        id: release_info
        run: |
          RELEASE_DATA=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")

          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name' | sed 's/^v//')
          ASSET_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | contains(".tar.gz")) | .browser_download_url')

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "ASSET_URL=${ASSET_URL}" >> $GITHUB_ENV

      - name: Download and calculate SHA256
        run: |
          curl -fsSL -o "finance-${VERSION}.tar.gz" "${ASSET_URL}"
          SHA256=$(sha256sum "finance-${VERSION}.tar.gz" | cut -d' ' -f1)
          echo "SHA256=${SHA256}" >> $GITHUB_ENV

      - name: Dispatch to homebrew-tap
        continue-on-error: true
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.TAP_UPDATE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/itomek/homebrew-tap/dispatches \
            -d "$(jq -n \
              --arg version "$VERSION" \
              --arg sha256 "$SHA256" \
              --arg url "$ASSET_URL" \
              '{event_type:"formula-update",client_payload:{formula:"finance",version:$version,sha256:$sha256,download_url:$url}}')"

      - name: Dispatch to scoop-bucket
        continue-on-error: true
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.TAP_UPDATE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/itomek/scoop-bucket/dispatches \
            -d "$(jq -n \
              --arg version "$VERSION" \
              --arg sha256 "$SHA256" \
              --arg url "$ASSET_URL" \
              '{event_type:"manifest-update",client_payload:{formula:"finance",version:$version,sha256:$sha256,download_url:$url}}')"